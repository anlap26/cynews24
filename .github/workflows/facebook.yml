# Posts each new article once to the CyNews24 Facebook Page after Build site
# has committed the pages. The post language is FB_POST_LANG (default en),
# linking to /en/<slug>/. The job waits until that URL returns HTTP 200 and
# the live page has og:title, og:description and og:image, so the link preview
# can be built from the deployed page.
#
# Dedup state lives in source/content/facebook-posted.json. This workflow commits
# that file with GITHUB_TOKEN, which does not start other workflows. build.yml
# also ignores that path, so a state commit cannot rebuild the site or post again.
#
# Repository secrets: FB_PAGE_TOKEN (never-expiring Page token with
# pages_manage_posts) and FB_PAGE_ID. If either is unset the job logs a notice,
# does not change the state file and exits green. Values are never printed.
# The dry_run dispatch input prints the messages, checks the Page name, and
# does not publish.
name: Post to Facebook

on:
  workflow_run:
    workflows: ["Build site"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the Facebook posts and do not publish them"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: facebook-post
  cancel-in-progress: false

jobs:
  post:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Update main
        run: git pull --ff-only origin main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Post new articles
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_POST_LANG: en
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' }}
          PUSH_STATE: "1"
          BASE: https://cynews24.net
        run: |
          if [ -n "$FB_PAGE_TOKEN" ]; then
            echo "FB_PAGE_TOKEN is configured (value not printed)."
          else
            echo "FB_PAGE_TOKEN is not set (value not printed)."
          fi
          if [ -n "$FB_PAGE_ID" ]; then
            echo "FB_PAGE_ID is configured (value not printed)."
          else
            echo "FB_PAGE_ID is not set (value not printed)."
          fi
          echo "FB_POST_LANG=${FB_POST_LANG}"
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: posts are printed below and nothing is published."
          fi
          python source/facebook_post.py
